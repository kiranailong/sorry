
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sorry</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
:root {
    --cream: #eee5da;
    --cream-light: #f4ede4;
    --beige: #e7d8c9;
    --pink: #d5a5ac;
    --pink-light: #e2bdc0;
    --pink-dark: #aa7781;
    --ink: #66534e;
    --muted: #9b8180;
    --white-soft: #f8f1e9;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    background: var(--cream);
}

body {
    min-height: 100vh;
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
    background: var(--cream);
    overflow-x: hidden;
}

button, input {
    font: inherit;
}

button {
    -webkit-tap-highlight-color: transparent;
    cursor: pointer;
}

.page {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
}

/* =================================
   COUNTDOWN PAGE
================================= */

#countdownPage {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 35px 24px;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 8% 12%,
            rgba(213,165,172,.18), transparent 43%),
        radial-gradient(ellipse at 92% 88%,
            rgba(183,151,119,.15), transparent 45%),
        linear-gradient(135deg,
            #eee5da, #eaded5 48%, #e9ded2);
    transition:
        opacity .48s ease,
        filter .55s ease,
        transform .65s cubic-bezier(.22,1,.36,1);
}

#countdownPage::before {
    content: "";
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(151,112,108,.17);
    pointer-events: none;
}

#countdownPage.leaving {
    opacity: 0;
    filter: blur(7px);
    transform: scale(1.018);
    pointer-events: none;
}

#countdownPage.entering {
    animation: countdownEnter .8s ease both;
}

.countdown-content {
    position: relative;
    z-index: 1;
    width: min(100%, 820px);
    text-align: center;
}

/* =================================
   INTRO SORRY
================================= */

.intro-title {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(5px, 1.5vw, 15px);
    width: 100%;
    min-height: clamp(100px, 15vw, 155px);
    margin: 0 auto 30px;
    overflow: visible;
}

.sorry-letter {
    display: block;
    flex: 0 1 auto;
    width: clamp(48px, 10.5vw, 108px);
    height: clamp(66px, 12vw, 126px);
    max-width: 17%;
    object-fit: contain;

    opacity: 0;
    filter: blur(15px);

    animation-name: sorryEnterFromEdge !important;
    animation-duration: 1.7s !important;
    animation-timing-function: cubic-bezier(.16, 1, .3, 1) !important;
    animation-fill-mode: both !important;
    animation-delay: var(--delay, 0s) !important;

    will-change: transform, opacity, filter;
}

.sorry-letter:nth-child(odd) {
    --from-x: -150vw;
    --from-rotate: -40deg;
    --tilt: -8deg;
}

.sorry-letter:nth-child(even) {
    --from-x: 150vw;
    --from-rotate: 40deg;
    --tilt: 8deg;
}

@keyframes sorryEnterFromEdge {
    0% {
        opacity: 0;
        filter: blur(15px);
        transform:
            translate3d(var(--from-x), 50px, 0)
            rotate(var(--from-rotate))
            scale(.35);
    }

    30% {
        opacity: .35;
        filter: blur(9px);
    }

    72% {
        opacity: 1;
        filter: blur(0);
        transform:
            translate3d(0, -12px, 0)
            rotate(calc(var(--tilt) * 2))
            scale(1.12);
    }

    86% {
        transform:
            translate3d(0, 4px, 0)
            rotate(calc(var(--tilt) * -.7))
            scale(.97);
    }

    100% {
        opacity: 1;
        filter: blur(0);
        transform:
            translate3d(0, 0, 0)
            rotate(var(--tilt))
            scale(1);
    }
}

/* Countdown muncul setelah intro selesai */

.countdown,
.open-btn {
    opacity: 0;
    visibility: hidden;
    transform: translateY(13px);
}

.countdown.intro-ready,
.open-btn.intro-ready {
    visibility: visible;
    animation: contentReveal .8s cubic-bezier(.22,1,.36,1) forwards;
}

.open-btn.intro-ready {
    animation-delay: .18s;
}

/* =================================
   COUNTDOWN
================================= */

.countdown {
    display: grid;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 16px;
    margin-bottom: 40px;
}

.time-box {
    aspect-ratio: 1 / .94;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 15px;

    background: rgba(255, 248, 241, .38);
    backdrop-filter: blur(18px) saturate(115%);
    -webkit-backdrop-filter: blur(18px) saturate(115%);

    border: 1px solid rgba(255, 250, 245, .58);
    border-radius: 19px;

    box-shadow:
        0 12px 35px rgba(111, 83, 75, .055),
        inset 0 1px 1px rgba(255, 255, 255, .38),
        inset 0 -1px 1px rgba(190, 158, 147, .08);

    filter: blur(6px);

    transition:
        background .4s ease,
        border-color .4s ease,
        box-shadow .4s ease,
        filter .4s ease,
        transform .4s ease;
}

.time-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(35px, 6.2vw, 63px);
    font-weight: 500;
    line-height: 1;
    color: #886d70;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 1px 1px rgba(255, 255, 255, .15);
}

.time-label {
    color: #987d7d;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 2.5px;
    text-transform: uppercase;
}

.time-box:hover {
    filter: blur(6px);
    transform: translateY(-2px);
    background: rgba(255, 249, 244, .40);
    border-color: rgba(255, 255, 255, .78);

    box-shadow:
        0 15px 38px rgba(111, 83, 75, .08),
        inset 0 1px 2px rgba(255, 255, 255, .48);
}

@media (max-width: 520px) {
    .time-box {
        gap: 9px;
        border-radius: 12px;
        filter: blur(7px);
    }

    .time-box:hover {
        filter: blur(7px);
    }
}

/* =================================
   OPEN LETTER BUTTON
================================= */

.open-btn {
    position: relative;
    overflow: hidden;
    width: min(420px, 88%);
    padding: 19px 30px;
    border: 1px solid rgba(255,247,240,.55);
    border-radius: 999px;
    background: linear-gradient(115deg,#bd8e97,#c99aa2,#bd8e97);
    color: #fff8f2;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2.8px;
    text-transform: uppercase;
    box-shadow: 0 8px 22px rgba(129,87,94,.13);
    transition: transform .4s ease, box-shadow .4s ease;
}

.open-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 13px 27px rgba(129,87,94,.17);
}

.open-btn:active {
    transform: scale(.985);
}

/* =================================
   PASSWORD MODAL
================================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 22px;
    background: rgba(75,58,52,.34);
    backdrop-filter: blur(8px);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .38s ease, visibility .38s ease;
}

.modal-overlay.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.password-card {
    position: relative;
    width: min(100%,370px);
    padding: 43px 31px 29px;
    border: 1px solid rgba(255,250,241,.8);
    border-radius: 25px;
    background: linear-gradient(145deg,#f4ebdf,#efe2d6 58%,#ead8d3);
    box-shadow: 0 24px 60px rgba(64,45,40,.16);
    transform: translateY(20px) scale(.96);
    opacity: 0;
    transition: transform .48s ease, opacity .38s ease;
}

.modal-overlay.show .password-card {
    transform: translateY(0) scale(1);
    opacity: 1;
}

.close-modal {
    position: absolute;
    top: 13px;
    right: 14px;
    width: 32px;
    height: 32px;
    border: 0;
    border-radius: 50%;
    background: #e8d4d1;
    color: #91666d;
    font-size: 22px;
}

.password-card h2 {
    margin-bottom: 26px;
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 38px;
    font-weight: 500;
    color: #986e77;
}

.password-input-wrap {
    position: relative;
}

.password-input {
    width: 100%;
    padding: 15px 45px 15px 16px;
    border: 1px solid #d9c2b9;
    border-radius: 12px;
    outline: none;
    background: rgba(249,243,235,.78);
    color: #66504d;
    font-size: 13px;
    letter-spacing: 1px;
}

.password-input:focus {
    border-color: #c49aa0;
    box-shadow: 0 0 0 3px rgba(196,154,160,.13);
}

.toggle-password {
    position: absolute;
    top: 50%;
    right: 9px;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: #a47780;
}

.submit-btn {
    width: 100%;
    margin-top: 15px;
    padding: 15px 20px;
    border: 0;
    border-radius: 999px;
    background: linear-gradient(115deg,#bd8e97,#cda0a7);
    color: #fff8f2;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2.3px;
    text-transform: uppercase;
}

.error-msg {
    min-height: 18px;
    margin-top: 12px;
    text-align: center;
    color: #a55e68;
    font-size: 11px;
}

/* =================================
   LETTER PAGE
================================= */

#letterPage {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 44px 20px 34px;
    background:
        radial-gradient(ellipse at 8% 12%,rgba(213,165,172,.16),transparent 38%),
        radial-gradient(ellipse at 92% 90%,rgba(183,151,119,.13),transparent 40%),
        linear-gradient(135deg,#eee5da,#eaded5 60%,#e9ded2);
    opacity: 0;
}

#letterPage.show {
    display: flex;
    animation: letterBackgroundEnter .9s ease-out both;
}

#letterPage.leaving {
    animation: letterBackgroundExit .35s ease-in both;
    pointer-events: none;
}

.letter-wrap {
    width: min(100%,650px);
    margin: auto;
}

.paper {
    position: relative;
    overflow: hidden;
    padding: clamp(30px,6vw,62px);
    border: 1px solid rgba(169,133,108,.3);
    border-radius: 14px;
    background:
        radial-gradient(ellipse at 8% 5%,rgba(201,162,126,.12),transparent 30%),
        radial-gradient(ellipse at 100% 95%,rgba(206,157,147,.14),transparent 34%),
        linear-gradient(135deg,#f6eddf,#efe0ce 55%,#f7eddf);
    box-shadow: 0 22px 60px rgba(99,69,57,.09);
    transform-origin: center bottom;
    will-change: transform, opacity;
}

.paper::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 1px solid rgba(169,133,108,.2);
    border-radius: 8px;
    pointer-events: none;
}

.paper-content {
    position: relative;
    z-index: 1;
}

/* =========================================
   SLOW PAPER PULL — KERTAS DITARIK NAIK
========================================= */

#letterPage.show .paper {
    animation: paperPopupFromBottom 2.5s
        cubic-bezier(0.25, 0.1, 0.25, 1) both !important;
    will-change: transform, opacity;
}

@keyframes paperPopupFromBottom {
    0% {
        opacity: 0;
        transform: translate3d(0, 100vh, 0);
    }

    10% {
        opacity: 1;
        transform: translate3d(0, 90vh, 0);
    }

    100% {
        opacity: 1;
        transform: translate3d(0, 0, 0);
    }
}

.paper-top {
    margin-bottom: 30px;
    text-align: center;
}

.paper-top .small {
    margin-bottom: 15px;
    color: #a78080;
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
}

.paper-top h1 {
    color: #ae7985;
    font-family: 'Great Vibes', cursive;
    font-size: clamp(43px,8vw,62px);
    font-weight: 400;
}

.paper-line {
    width: 45px;
    height: 1px;
    margin: 20px auto 0;
    background: #cba0a0;
}

.letter-text {
    color: #5c4a43;
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-weight: 500;
    line-height: 1.9;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.letter-sign {
    margin-top: 28px;
    text-align: right;
    color: #7d5b60;
}

.letter-sign p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-style: italic;
}

.letter-sign div {
    margin-top: 5px;
    color: #ae7985;
    font-family: 'Great Vibes', cursive;
    font-size: 34px;
}

.paper-bottom {
    margin-top: 28px;
    color: #a88b81;
    font-size: 9px;
    letter-spacing: 3px;
    text-align: center;
    text-transform: uppercase;
}

.back-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    width: fit-content;
    max-width: 100%;
    margin: 25px auto 0;
    padding: 12px 19px;
    border: 1px solid rgba(169,133,108,.22);
    border-radius: 999px;
    background: rgba(246,237,226,.52);
    color: #98787a;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 1.8px;
}

.back-link:hover {
    background: rgba(248,239,231,.9);
}

/* =================================
   ANIMATIONS
================================= */

@keyframes contentReveal {
    to {
        opacity: 1;
        visibility: visible;
        transform: translateY(0);
    }
}

@keyframes letterBackgroundEnter {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes letterBackgroundExit {
    from { opacity: 1; }
    to { opacity: 0; }
}

@keyframes paperPopupFromBottom {
    0% {
        opacity: 0;
        transform: translate3d(0, 110vh, 0) scale(.985);
        filter: blur(2px);
    }

    12% {
        opacity: 1;
    }

    68% {
        opacity: 1;
        transform: translate3d(0, -9px, 0) scale(1.002);
        filter: blur(0);
    }

    84% {
        transform: translate3d(0, 3px, 0) scale(.999);
    }

    100% {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
        filter: blur(0);
    }
}

@keyframes countdownEnter {
    from {
        opacity: 0;
        filter: blur(5px);
        transform: scale(.99);
    }

    to {
        opacity: 1;
        filter: blur(0);
        transform: scale(1);
    }
}

/* =================================
   RESPONSIVE ASLI
================================= */

@media (max-width:520px) {
    #countdownPage::before { inset: 10px; }

    .intro-title {
        gap: 5px;
        margin-bottom: 25px;
        min-height: 82px;
    }

    .sorry-letter {
        width: clamp(42px,14vw,68px);
        height: clamp(58px,18vw,88px);
    }

    .countdown {
        gap: 8px;
        margin-bottom: 31px;
    }

    .time-box {
        gap: 9px;
        border-radius: 12px;
    }

    .time-number {
        font-size: clamp(27px,8vw,40px);
    }

    .time-label {
        font-size: 8px;
        letter-spacing: 1.2px;
    }

    .open-btn {
        padding: 18px 20px;
        font-size: 9px;
        letter-spacing: 2px;
    }

    .password-card {
        padding: 43px 24px 28px;
    }

    #letterPage {
        padding: 26px 15px 30px;
    }

    .paper {
        padding: 35px 25px;
    }

    .letter-text {
        font-size: 17px;
        line-height: 1.85;
    }

    .letter-sign div {
        font-size: 31px;
    }
}

@media (max-width:360px) {
    .intro-title { gap: 3px; }

    .sorry-letter {
        width: 13vw;
        height: 58px;
    }

    .countdown { gap: 6px; }

    .time-number { font-size: 25px; }

    .time-label {
        font-size: 7px;
        letter-spacing: .8px;
    }

    .paper { padding: 30px 20px; }
}

@media (min-width:521px) and (max-width:900px) {
    #letterPage {
        padding: 35px 28px;
    }

    .letter-wrap {
        width: min(100%,620px);
    }

    .paper {
        padding: clamp(35px,6vw,52px);
    }

    .letter-text {
        font-size: 19px;
        line-height: 1.85;
    }

    .countdown {
        gap: 13px;
    }

    .time-box {
        gap: 12px;
        border-radius: 16px;
    }
}

@media (prefers-reduced-motion:reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
    }
}

/* SEMBUNYIKAN GARIS SCROLLBAR */

html,
body,
#letterPage {
    scrollbar-width: none;
    -ms-overflow-style: none;
}

html::-webkit-scrollbar,
body::-webkit-scrollbar,
#letterPage::-webkit-scrollbar {
    display: none;
    width: 0;
    height: 0;
}

/* Scroll tetap aktif */

html,
body {
    overflow-x: hidden;
    overflow-y: auto;
}

#letterPage {
    overflow-x: hidden;
    overflow-y: visible;
}

/* FIX TOMBOL BACK AGAR MUDAH DIKLIK */

#letterPage .letter-wrap {
    position: relative;
    z-index: 10;
    width: min(100%, 650px);
    margin: 0 auto;
}

#letterPage .back-link {
    position: relative;
    z-index: 100;
    isolation: isolate;
    min-height: 48px;
    margin: 25px auto 10px;
    padding: 14px 22px;
    pointer-events: auto;
    touch-action: manipulation;
    cursor: pointer;
}

#letterPage .back-link:disabled {
    opacity: 0.6;
    pointer-events: none;
}

#letterPage.leaving {
    pointer-events: none;
}

#letterPage {
    padding-bottom: 35px;
}

/* HAPUS GARIS KOTAK DI HALAMAN AWAL */

#countdownPage::before {
    display: none !important;
}

/* =========================================
   RESPONSIVE TAMBAHAN
   HANYA UKURAN DAN TATA LETAK
   WARNA, FONT, TEKS, DAN ANIMASI TETAP
========================================= */

/* Semua ukuran layar */

img {
    max-width: 100%;
}

#countdownPage,
#letterPage {
    width: 100%;
    max-width: 100%;
}

.countdown-content {
    min-width: 0;
    margin-inline: auto;
}

.intro-title {
    max-width: 100%;
}

.sorry-letter {
    min-width: 0;
}

.countdown {
    width: 100%;
    grid-template-columns: repeat(4, minmax(0, 1fr));
}

.time-box {
    min-width: 0;
}

.time-number,
.time-label {
    max-width: 100%;
}

.open-btn {
    max-width: 100%;
    white-space: normal;
    overflow-wrap: anywhere;
    touch-action: manipulation;
}

.modal-overlay {
    overflow-y: auto;
    overscroll-behavior: contain;
}

.password-card {
    flex: 0 1 370px;
    min-width: 0;
    max-width: 100%;
    max-height: calc(100dvh - 32px);
    overflow-y: auto;
    overscroll-behavior: contain;
}

.password-input,
.submit-btn {
    min-width: 0;
}

#letterPage {
    min-height: 100vh;
    min-height: 100svh;
    height: auto;
    flex-shrink: 0;
}

#letterPage .letter-wrap {
    flex: 0 0 auto;
    min-width: 0;
    max-width: 100%;
}

.paper {
    width: 100%;
    min-width: 0;
}

.paper-content,
.letter-text {
    min-width: 0;
    max-width: 100%;
}

.letter-text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: normal;
}

.back-link {
    white-space: normal;
    text-align: center;
    line-height: 1.6;
}

/* HP dan layar sempit */

@media (max-width: 520px) {
    #countdownPage {
        min-height: 100vh;
        min-height: 100svh;
        padding:
            max(24px, env(safe-area-inset-top))
            clamp(16px, 5vw, 24px)
            max(24px, env(safe-area-inset-bottom));
    }

    .countdown-content {
        width: 100%;
    }

    .intro-title {
        width: 100%;
        min-height: clamp(70px, 22vw, 100px);
        gap: clamp(2px, 1.3vw, 6px);
        margin-bottom: clamp(18px, 5vw, 25px);
    }

    .sorry-letter {
        width: calc((100% - 5 * clamp(2px, 1.3vw, 6px)) / 6);
        height: clamp(48px, 19vw, 88px);
        max-width: none;
        flex: 0 1 calc((100% - 10px) / 6);
    }

    .countdown {
        gap: clamp(5px, 2vw, 9px);
        margin-bottom: clamp(24px, 7vw, 31px);
    }

    .time-box {
        aspect-ratio: 1 / .94;
        padding: 5px 1px;
        gap: clamp(5px, 2.2vw, 9px);
        border-radius: clamp(9px, 3vw, 12px);
    }

    .time-number {
        font-size: clamp(22px, 7.8vw, 40px);
        letter-spacing: -0.5px;
    }

    .time-label {
        font-size: clamp(6px, 1.9vw, 8px);
        letter-spacing: clamp(.3px, .35vw, 1.2px);
        line-height: 1.4;
        overflow-wrap: anywhere;
    }

    .open-btn {
        width: min(100%, 420px);
        padding: 17px clamp(12px, 4vw, 20px);
        font-size: clamp(8px, 2.2vw, 9px);
        letter-spacing: clamp(1px, .5vw, 2px);
    }

    .modal-overlay {
        padding:
            max(12px, env(safe-area-inset-top))
            14px
            max(12px, env(safe-area-inset-bottom));
    }

    .password-card {
        width: 100%;
        flex-basis: 370px;
        padding: 42px clamp(18px, 6vw, 24px) 25px;
        border-radius: 22px;
    }

    .password-card h2 {
        font-size: clamp(32px, 9vw, 38px);
    }

    .password-input {
        font-size: 16px;
    }

    #letterPage {
        padding:
            max(22px, env(safe-area-inset-top))
            clamp(12px, 4vw, 20px)
            max(25px, env(safe-area-inset-bottom));
    }

    #letterPage .letter-wrap {
        width: 100%;
    }

    .paper {
        padding: clamp(28px, 7vw, 35px) clamp(20px, 5.5vw, 25px);
    }

    .paper::before {
        inset: 7px;
    }

    .paper-top {
        margin-bottom: clamp(22px, 6vw, 30px);
    }

    .paper-top .small {
        font-size: clamp(7px, 2vw, 9px);
        letter-spacing: clamp(2px, .8vw, 4px);
        line-height: 1.7;
    }

    .paper-top h1 {
        font-size: clamp(40px, 11vw, 56px);
    }

    .letter-text {
        font-size: clamp(16px, 4.5vw, 17px);
        line-height: 1.85;
    }

    .letter-sign {
        margin-top: 24px;
    }

    .letter-sign div {
        font-size: clamp(27px, 8vw, 31px);
    }

    .paper-bottom {
        font-size: clamp(7px, 1.9vw, 9px);
        letter-spacing: clamp(1px, .7vw, 3px);
        line-height: 1.8;
        overflow-wrap: anywhere;
    }

    #letterPage .back-link {
        width: fit-content;
        max-width: 100%;
        min-height: 48px;
        margin: 20px auto 8px;
        padding: 12px 18px;
        font-size: clamp(8px, 2.1vw, 9px);
        letter-spacing: clamp(1px, .4vw, 1.8px);
    }
}

/* HP yang sangat kecil */

@media (max-width: 360px) {
    #countdownPage {
        padding-inline: 13px;
    }

    .intro-title {
        gap: 2px;
    }

    .sorry-letter {
        flex-basis: calc((100% - 10px) / 6);
        width: calc((100% - 10px) / 6);
        height: clamp(43px, 17vw, 58px);
    }

    .countdown {
        gap: 5px;
    }

    .time-box {
        padding-inline: 0;
    }

    .time-number {
        font-size: clamp(20px, 7.2vw, 25px);
    }

    .time-label {
        font-size: 6px;
        letter-spacing: .25px;
    }

    .open-btn {
        padding-inline: 10px;
    }

    .password-card {
        padding-inline: 17px;
    }

    #letterPage {
        padding-inline: 10px;
    }

    .paper {
        padding: 28px 18px;
    }

    .letter-text {
        font-size: 16px;
        line-height: 1.8;
    }

    .paper-top .small {
        letter-spacing: 1.8px;
    }
}

/* Tablet */

@media (min-width: 521px) and (max-width: 900px) {
    #countdownPage {
        padding: 32px clamp(24px, 5vw, 45px);
    }

    .countdown-content {
        width: min(100%, 720px);
    }

    .intro-title {
        gap: clamp(8px, 1.8vw, 15px);
    }

    .sorry-letter {
        width: clamp(55px, 10vw, 90px);
        height: clamp(70px, 12vw, 112px);
    }

    .countdown {
        gap: clamp(10px, 2vw, 15px);
    }

    .time-number {
        font-size: clamp(34px, 6vw, 52px);
    }

    .time-label {
        font-size: clamp(8px, 1.3vw, 9px);
        letter-spacing: clamp(1px, .3vw, 2px);
    }

    #letterPage {
        padding: 32px clamp(22px, 5vw, 40px);
    }

    #letterPage .letter-wrap {
        width: min(100%, 650px);
    }

    .paper {
        padding: clamp(36px, 6vw, 52px);
    }

    .letter-text {
        font-size: 19px;
        line-height: 1.85;
    }
}

/* Laptop atau desktop dengan tinggi layar terbatas */

@media (min-width: 901px) and (max-height: 700px) {
    #countdownPage {
        padding-top: 22px;
        padding-bottom: 22px;
    }

    .intro-title {
        min-height: clamp(75px, 14vh, 115px);
        margin-bottom: 18px;
    }

    .sorry-letter {
        height: clamp(65px, 16vh, 105px);
    }

    .countdown {
        gap: 13px;
        margin-bottom: 24px;
    }

    .time-box {
        gap: 10px;
    }

    #letterPage {
        padding-top: 24px;
        padding-bottom: 25px;
    }
}

/* HP landscape: beri ruang vertikal untuk seluruh isi */

@media (max-width: 900px) and (orientation: landscape) {
    #countdownPage {
        min-height: 100vh;
        min-height: 100svh;
        padding: 18px 24px;
    }

    .countdown-content {
        width: min(100%, 650px);
    }

    .intro-title {
        min-height: clamp(48px, 17vh, 85px);
        margin-bottom: 12px;
    }

    .sorry-letter {
        height: clamp(42px, 15vh, 76px);
    }

    .countdown {
        gap: clamp(7px, 1.8vw, 13px);
        margin-bottom: 18px;
    }

    .time-box {
        gap: 7px;
    }

    .time-number {
        font-size: clamp(22px, 5.5vh, 36px);
    }

    .time-label {
        font-size: 7px;
        letter-spacing: 1px;
    }

    .open-btn {
        padding-top: 13px;
        padding-bottom: 13px;
    }

    #letterPage {
        padding-top: 18px;
        padding-bottom: 20px;
    }

    #letterPage .letter-wrap {
        width: min(100%, 650px);
    }

    .paper {
        padding-top: 30px;
        padding-bottom: 30px;
    }

    .paper-top {
        margin-bottom: 20px;
    }

    .letter-text {
        line-height: 1.75;
    }

    .modal-overlay {
        align-items: flex-start;
        padding-top: 12px;
        padding-bottom: 12px;
    }

    .password-card {
        margin-block: auto;
        padding-top: 35px;
        padding-bottom: 20px;
    }

    .password-card h2 {
        margin-bottom: 17px;
    }
}

/* Layar sangat pendek, termasuk HP landscape */

@media (max-height: 440px) {
    #countdownPage {
        padding-top: 12px;
        padding-bottom: 12px;
    }

    .intro-title {
        min-height: 42px;
        margin-bottom: 9px;
    }

    .sorry-letter {
        height: 40px;
    }

    .countdown {
        margin-bottom: 12px;
    }

    .time-box {
        gap: 5px;
    }

    .open-btn {
        padding-top: 10px;
        padding-bottom: 10px;
    }

    #letterPage {
        padding-top: 12px;
        padding-bottom: 16px;
    }
}
</style>
</head>

<body>

<!-- COUNTDOWN PAGE -->
<section class="page" id="countdownPage">
    <main class="countdown-content">

        <div class="intro-title" id="sorryIntro" aria-label="SORRY">
            <img class="sorry-letter" src="s.png" alt="S" style="--delay:0s">
            <img class="sorry-letter" src="o.png" alt="O" style="--delay:.22s">
            <img class="sorry-letter" src="r.png" alt="R" style="--delay:.44s">
            <img class="sorry-letter" src="r2.png" alt="R" style="--delay:.66s">
            <img class="sorry-letter" src="y.png" alt="Y" style="--delay:.88s">
            <img class="sorry-letter" src="tanya.png" alt="Y" style="--delay:.88s">
        </div>

        <div class="countdown" id="countdown">
            <div class="time-box">
                <span class="time-number" id="days">000</span>
                <span class="time-label">Days</span>
            </div>
            <div class="time-box">
                <span class="time-number" id="hours">00</span>
                <span class="time-label">Hours</span>
            </div>
            <div class="time-box">
                <span class="time-number" id="minutes">00</span>
                <span class="time-label">Minutes</span>
            </div>
            <div class="time-box">
                <span class="time-number" id="seconds">00</span>
                <span class="time-label">Seconds</span>
            </div>
        </div>

        <button class="open-btn" id="openLetterBtn" type="button">
            Open My Letter&nbsp; ♡
        </button>

    </main>
</section>

<!-- PASSWORD MODAL -->
<div class="modal-overlay" id="passwordModal" aria-hidden="true">
    <div class="password-card" role="dialog" aria-modal="true" aria-labelledby="passwordTitle">

        <button class="close-modal" id="closeModal" type="button" aria-label="Tutup">&times;</button>

        <h2 id="passwordTitle">Password</h2>

        <form id="passwordForm">
            <div class="password-input-wrap">
                <input class="password-input" id="passwordInput" type="password"
                    placeholder="Masukkan password" autocomplete="off" required>

                <button class="toggle-password" id="togglePassword" type="button"
                    aria-label="Lihat password" title="Lihat atau sembunyikan password">
                    <svg id="eyeIcon" width="19" height="19" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="1.7"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </button>
            </div>

            <button class="submit-btn" type="submit">Send Password</button>
            <p class="error-msg" id="errorMsg" aria-live="polite"></p>
        </form>
    </div>
</div>

<!-- LETTER PAGE -->
<section class="page" id="letterPage">
    <div class="letter-wrap">
        <article class="paper">
            <div class="paper-content">

                <header class="paper-top">
                    <p class="small">STILL SEVENTEEN</p>
                    <h1>I'm sorry.</h1>
                    <div class="paper-line"></div>
                </header>

                <div class="letter-text" id="letterText"></div>

                <footer class="letter-sign">
                    <p>surat ini di peruntukkan</p>
                    <div>Driver Kroco</div>
                </footer>

                <div class="paper-bottom">
                    LUCKY +1
                </div>

            </div>
        </article>

        <button class="back-link" id="backBtn" type="button">
            <span aria-hidden="true">←</span>
            BACK TO COUNTDOWN
        </button>
    </div>
</section>

<script>
/* SETTINGS */

const CORRECT_PASSWORD = "sorry";

const TARGET_DATE = new Date(
    "2026-12-19T00:00:00+07:00"
).getTime();

const APOLOGY_LETTER = `Sebanyak banyaknya kata maaf kayanya gak bisa merubah banyak keadaan.

Kata orang-orang, mengirim surat itu kaya kegiatan yang sudah kuno, tapi menurutku itu titik serunya. Bagaimanapun, aku bakal mencoba untuk tidak banyak menciptakan sampah karya.

Di kelas 12 ini, aku mencoba belajar untuk ikhlas, dalam artian tidak terlalu banyak mengharapkan dan selalu sabar. Keliatannya mudah, namun ternyata hal simple ini sangat susah untuk di realisasikan. Seperti burung yang terkurung atau seseorang yang terjebak dalam ikatan, mereka akan selalu mencari cara untuk bebas, meskipun banyak dari mereka termakan oleh rapalan janji yang terdengar omong kosong saat ini.

Menurutku, seseorang yang mencoba untuk tetap bertahan, mereka terlalu egois untuk mendapatkan apa yang ia inginkan. Akhir cerita ini tidak dapat di benahi jika kata maaf bisa di lakukan secara berulang kali, dengan harapan seseorang akan datang menemani di saat apapun. Aku mencoba untuk tidak terlalu banyak mengusik, tapi dalam hatiku mencoba menepisnya. Rasanya seperti ada yang belum tuntas. (Doakan saja agar project ini bisa berjalan lancar hingga akhir.) Panjatan doa selalu ku ucap seperti wadah penuh yang kupaksakan masuk oleh suatu hal, sampai bagian ini kamu pasti bertanya tanya dengan apa yang ku maksud. Satu hal yang ingin ku katakan, yakni, "tunggu sebentar lagi selepas itu kamu tidak akan terikat dengan macam bentuk kesialan."

Aku cuman bisa menjelaskan beberapa bagian saja. Kayanya terlalu banyak berpikir juga gak baik? Akunku masih di pulihkan saat itu, cuman yang berhasil hanya satu saja. Aku juga gak pernah kepikiran untuk block akunmu, apalagi thirdmu, mana tau aku?

Alasan aku nge block kamu karena aku sempat marah. Mungkin aku banyak sakit hati seperti kekanak kanakannya, tapi aku baru bisa menerima saat saat ini. Maaf jika adaptasi ku terlalu lama, aku hanya mencoba belajar dari kesalahan. Aku gak akan pernah menyalahkan siapapun karena aku tidak suka menghakimi dan aku benci di hakimi, sebab semua orang bisa berbuat salah dan tidak ada yang lebih sempurna dari sang pencipta.

Aku harap kamu bisa menghargai keputusan yang akan ku ambil nantinya, dan aku akan menghargai apapun keputusan yang kamu pilih.

Terimakasi sudah baca, senang sekali jika kamu membaca dengan hati yang tenang.

Always be happy.

Take your time. ♡`;

/* INTRO ANIMATION */

const countdownEl = document.getElementById("countdown");
const openButton = document.getElementById("openLetterBtn");
const introLetters = document.querySelectorAll(".sorry-letter");

function revealCountdown() {
    countdownEl.classList.add("intro-ready");
    openButton.classList.add("intro-ready");
}

if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    introLetters.forEach(img => {
        img.style.opacity = "1";
        img.style.transform = "none";
        img.style.filter = "none";
        img.style.animation = "none";
    });
    revealCountdown();
} else {
    setTimeout(revealCountdown, 3000);
}

/* COUNTDOWN */

function updateCountdown() {
    let distance = TARGET_DATE - Date.now();

    if (distance <= 0) {
        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";
        return;
    }

    const days = Math.floor(distance / 86400000);
    distance %= 86400000;

    const hours = Math.floor(distance / 3600000);
    distance %= 3600000;

    const minutes = Math.floor(distance / 60000);
    const seconds = Math.floor((distance % 60000) / 1000);

    document.getElementById("days").textContent =
        String(days).padStart(2, "0");

    document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

    document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

    document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");
}

updateCountdown();
setInterval(updateCountdown, 1000);

/* ELEMENTS */

const modal = document.getElementById("passwordModal");
const passwordInput = document.getElementById("passwordInput");
const errorMsg = document.getElementById("errorMsg");
const countdownPage = document.getElementById("countdownPage");
const letterPage = document.getElementById("letterPage");
const togglePassword = document.getElementById("togglePassword");
const eyeIcon = document.getElementById("eyeIcon");

let isTransitioning = false;

/* OPEN PASSWORD MODAL */

document.getElementById("openLetterBtn").addEventListener("click", () => {
    if (isTransitioning) return;

    errorMsg.textContent = "";
    modal.classList.add("show");
    modal.setAttribute("aria-hidden", "false");

    setTimeout(() => {
        if (modal.classList.contains("show")) {
            passwordInput.focus();
        }
    }, 300);
});

/* CLOSE PASSWORD MODAL */

function closePasswordModal() {
    modal.classList.remove("show");
    modal.setAttribute("aria-hidden", "true");

    passwordInput.value = "";
    passwordInput.type = "password";
    errorMsg.textContent = "";
    setPasswordEye(false);
}

document.getElementById("closeModal").addEventListener(
    "click", closePasswordModal
);

modal.addEventListener("click", event => {
    if (event.target === modal) closePasswordModal();
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape" && modal.classList.contains("show")) {
        closePasswordModal();
    }
});

/* SHOW / HIDE PASSWORD */

function setPasswordEye(isVisible) {
    togglePassword.setAttribute(
        "aria-label",
        isVisible ? "Sembunyikan password" : "Lihat password"
    );

    eyeIcon.innerHTML = isVisible
        ? `<path d="M3 3l18 18"/>
           <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/>
           <path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-4 4.8"/>
           <path d="M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7a10 10 0 0 0 4-.8"/>`
        : `<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
           <circle cx="12" cy="12" r="3"/>`;
}

togglePassword.addEventListener("click", () => {
    const isVisible = passwordInput.type === "password";
    passwordInput.type = isVisible ? "text" : "password";
    setPasswordEye(isVisible);
});

/* OPEN LETTER */

function openLetter() {
    if (isTransitioning) return;

    isTransitioning = true;

    document.getElementById("letterText").textContent = APOLOGY_LETTER;

    modal.classList.remove("show");
    modal.setAttribute("aria-hidden", "true");

    passwordInput.value = "";
    passwordInput.type = "password";
    setPasswordEye(false);

    setTimeout(() => {
        countdownPage.classList.add("leaving");

        setTimeout(() => {
            countdownPage.style.display = "none";

            letterPage.classList.remove("show", "leaving");
            letterPage.style.display = "flex";

            window.scrollTo(0, 0);
            void letterPage.offsetHeight;

            letterPage.classList.add("show");

            setTimeout(() => {
                isTransitioning = false;
            }, 2600);

        }, 430);
    }, 200);
}

/* CHECK PASSWORD */

document.getElementById("passwordForm").addEventListener("submit", event => {
    event.preventDefault();

    if (isTransitioning) return;

    if (passwordInput.value === CORRECT_PASSWORD) {
        errorMsg.textContent = "";
        openLetter();
    } else {
        errorMsg.textContent = "Password belum tepat. Coba lagi ya.";

        document.querySelector(".password-card").animate([
            { transform: "translateX(0)" },
            { transform: "translateX(-5px)" },
            { transform: "translateX(5px)" },
            { transform: "translateX(-3px)" },
            { transform: "translateX(0)" }
        ], {
            duration: 320,
            easing: "ease-in-out"
        });

        passwordInput.select();
    }
});

/* BACK TO COUNTDOWN */

const backBtn = document.getElementById("backBtn");

backBtn.addEventListener("click", function (event) {
    event.preventDefault();

    if (isTransitioning) return;

    isTransitioning = true;
    backBtn.disabled = true;

    letterPage.classList.add("leaving");

    setTimeout(() => {
        letterPage.classList.remove("show", "leaving");
        letterPage.style.display = "none";

        countdownPage.style.display = "flex";
        countdownPage.classList.remove("leaving", "entering");

        void countdownPage.offsetHeight;

        window.scrollTo({
            top: 0,
            left: 0,
            behavior: "auto"
        });

        countdownPage.classList.add("entering");

        setTimeout(() => {
            countdownPage.classList.remove("entering");

            backBtn.disabled = false;
            isTransitioning = false;
        }, 850);

    }, 380);
});
</script>

</body>
</html>
